name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Several jobs here clone a sibling repository, because the checks that matter
# most after the split are the ones that cross one. MOQOM_REPO_TOKEN is an
# organisation secret with read access to moqom-cloud; GITHUB_TOKEN cannot do it,
# since it is scoped to the repository it was issued for. See the
# "Cross-repository checks" section of README.md.
env:
  CARGO_TERM_COLOR: always

# Every job here runs on a Mac we own rather than on ubuntu-latest. GitHub stopped
# dispatching jobs entirely: each one fails in about three seconds with no runner
# assigned, no steps and no log, and the reason appears only in the check
# annotation -- "The job was not started because recent account payments have
# failed or your spending limit needs to be increased". That is the account rather
# than the monthly allowance, so it did not clear when August began, and nothing
# here has been checked since 28 July.
#
# Less of a compromise than it is for the engine: the plan check is a Python
# script, Terraform validates against provider schemas rather than against a
# kernel, and the Go here is a control plane that talks gRPC. `cla.yml` is
# deliberately left on ubuntu-latest -- it triggers on pull_request_target from
# forks, which is the one thing that should never be handed a machine somebody
# owns, and the private repository is why nothing has been reaching it anyway.
jobs:
  # The plan is a document, so nothing about it fails to compile. Checking it
  # against the tree is what keeps it from quietly becoming fiction -- in both
  # directions, since an item stuck on "pending" after the work landed misleads
  # exactly as much as one marked done that was never built.
  #
  # Most of the evidence now lives in other repositories, and unresolvable
  # evidence is reported as external rather than failed -- so checking out only
  # this one would leave the job passing while judging almost nothing. The
  # siblings are cloned to keep it meaningful.
  plan:
    name: Plan
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          path: moqom

      - uses: ./moqom/.github/actions/require-repo-token
        with:
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-engine
          path: moqom-engine
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-go
          path: moqom-go
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-rust
          path: moqom-rust
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-swift
          path: moqom-swift
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - name: Check the plan against the tree
        working-directory: moqom
        run: python3 tools/plan-check.py

  # Terraform is the one layer where a mistake is discovered by a failed apply
  # against a real project, which is the most expensive place to find one.
  # Formatting and schema validation are cheap and catch a useful fraction of it
  # -- not quota, org policy, or IAM propagation, which need a plan.
  terraform:
    name: Terraform
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff

      # Every module standalone as well as the roots: a module only ever
      # reached through a root can carry a schema error that the root's own
      # variables happen to paper over.
      - name: Validate
        run: |
          set -euo pipefail
          for dir in bootstrap envs/* modules/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  # The SDK is a repository of its own but is developed here, so this checks out
  # both: the control plane's own tests drive the Go SDK against a real server
  # over bufconn, which is worth considerably more than testing a mirror against
  # a stub. go.work is what points at the sibling, and it is committed.
  go:
    name: Go
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          path: moqom

      - uses: ./moqom/.github/actions/require-repo-token
        with:
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-go
          path: moqom-go
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      # For the token fixture only -- nothing here builds Rust. Checking out the
      # engine is cheaper than the alternative, which is a cross-language check
      # that skips itself in CI and reports green.
      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-engine
          path: moqom-engine
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: moqom/go/go.mod
          # Re-enable once there is a go.sum; setup-go's cache requires one.
          cache: false

      - name: Vet
        working-directory: moqom/go
        run: go vet ./...

      - name: Build
        working-directory: moqom/go
        run: go build ./...

      # MOQOM_REQUIRE_INTEROP turns the token fixture's "engine not checked out"
      # skip back into a failure. The engine repository is checked out for it,
      # since a skipped cross-language check is indistinguishable from a passing
      # one in a summary.
      - name: Test
        working-directory: moqom/go
        env:
          MOQOM_REQUIRE_INTEROP: "1"
          MOQOM_ENGINE_ROOT: ${{ github.workspace }}/moqom-engine
        run: go test ./...

      - name: Vet the SDK
        working-directory: moqom-go
        run: go vet ./...

      - name: Test the SDK
        working-directory: moqom-go
        run: go test ./...

  # The seam no single-language job can reach. A capability is a bit in each SDK
  # and an enum on the wire; a mapping table with two rows pointing at the same
  # wire value passes every test in every package above while handing a moderator
  # a power somebody meant to withhold.
  #
  # Both SDKs now live elsewhere, which makes this the job that would rot first
  # if it were left to each of them: neither can run it alone, and a check that
  # belongs to nobody stops running. It stays with the contract it is checking.
  interop:
    name: Interop (SDKs against the control plane)
    runs-on: [self-hosted, macOS, ARM64]
    steps:
      - uses: actions/checkout@v7
        with:
          path: moqom

      - uses: ./moqom/.github/actions/require-repo-token
        with:
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-go
          path: moqom-go
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/checkout@v7
        with:
          repository: moqom-cloud/moqom-rust
          path: moqom-rust
          token: ${{ secrets.MOQOM_REPO_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: moqom/go/go.mod
          cache: false

      # No rust-cache: the runner keeps its target directory between runs, and the
      # action prunes ~/.cargo/bin, which on a machine somebody works on is
      # theirs -- it deleted this one's rustup mid-session. See the note in
      # moqom-engine's ci.yml.

      - name: Run
        working-directory: moqom
        run: ./tools/interop.sh
