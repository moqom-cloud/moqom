name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml pins the version, and letting
      # rustup honour it keeps CI and local builds on exactly one compiler.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # A short fuzz run on every change, sized to catch a regression that the
  # property tests miss without holding up a PR. The deep runs happen on the
  # schedule in fuzz.yml; this is a smoke test, and it is only meaningful
  # because the corpus is seeded first.
  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed corpus
        run: |
          cargo run --example seed-corpus --features testing -- fuzz/corpus/decoders
          cargo run --example seed-corpus --features testing -- fuzz/corpus/control_frame

      - name: Fuzz decoders
        run: cargo +nightly fuzz run decoders -- -max_total_time=60

      - name: Fuzz control frame stream
        run: cargo +nightly fuzz run control_frame -- -max_total_time=60

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: rs/fuzz/artifacts/

  # Vendoring quinn is only worth anything if it stays unmodified and is
  # actually the copy that gets linked. Both claims decay silently, so both are
  # checked rather than trusted.
  vendor:
    name: Vendored quinn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify
        run: ./vendor/verify-quinn.sh

  # The only runner with an iOS SDK on it, which is the point. Three `#if
  # os(iOS)` branches in the SDK have never been compiled anywhere else, and the
  # sample app has only ever been typechecked against macOS. Building for the
  # simulator here is the first thing that reads them.
  swift:
    name: Swift
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7

      # Pinned rather than taking the image default. 16.4 is deliberately older
      # than local dev (26.x): the deployment target is iOS 17, and building
      # against the oldest SDK we claim to support is what catches an API that
      # only exists on newer ones. The cost is that isolation annotations differ
      # between the two SDKs, so local-green is not CI-green on its own.
      #
      # Failing loudly when the image drops this version is the point. An image
      # bump that silently moved the SDK would change what the job proves
      # without changing anything in this file.
      - name: Toolchain
        run: |
          if [ ! -d /Applications/Xcode_16.4.app ]; then
            echo "::error::Xcode 16.4 is gone from the runner image. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s /Applications/Xcode_16.4.app
          swift --version && xcodebuild -version

      # The package builds for macOS, so the shared logic -- rooms, layer
      # selection, the session machine -- is tested on the host rather than in a
      # simulator, which is faster and where all 103 tests live.
      - name: Build and test the package
        working-directory: sdk/ios
        run: |
          swift build
          swift test

      - name: Install xcodegen and xcbeautify
        run: brew install xcodegen xcbeautify

      # project.yml is the source and the pbxproj is generated, so this also
      # confirms the generator still agrees with the file.
      - name: Generate the sample project
        working-directory: samples/ios
        run: xcodegen generate

      # Booted explicitly rather than letting xcodebuild pick, so a runner image
      # that ships a different set of devices fails here with a clear message
      # instead of somewhere inside the test run.
      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['udid'] for rt in sorted(d, reverse=True) if 'iOS' in rt for dev in d[rt] if 'iPhone' in dev['name']))")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # The only place the SwiftUI layer runs. No signing: a simulator needs
      # none, and the runner has no team.
      #
      # pipefail is load-bearing. Without it the pipeline reports xcbeautify's
      # exit code, xcodebuild's failure is discarded, and the job goes green on
      # a broken build -- which is worse than having no job at all.
      - name: Run the sample's UI tests
        working-directory: samples/ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project MoqomRoom.xcodeproj \
            -scheme MoqomRoomUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

  # The plan is a document, so nothing about it fails to compile. Checking it
  # against the tree is what keeps it from quietly becoming fiction -- in both
  # directions, since an item stuck on "pending" after the work landed misleads
  # exactly as much as one marked done that was never built.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - name: Check the plan against the tree
        run: python3 tools/plan-check.py

  # Terraform is the one layer where a mistake is discovered by a failed apply
  # against a real project, which is the most expensive place to find one.
  # Formatting and schema validation are cheap and catch a useful fraction of it
  # -- not quota, org policy, or IAM propagation, which need a plan.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff

      # Every module standalone as well as the roots: a module only ever
      # reached through a root can carry a schema error that the root's own
      # variables happen to paper over.
      - name: Validate
        run: |
          set -euo pipefail
          for dir in bootstrap envs/* modules/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # Re-enable once there is a go.sum; setup-go's cache requires one.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
