name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v7

      # No toolchain action: rust-toolchain.toml pins the version, and letting
      # rustup honour it keeps CI and local builds on exactly one compiler.
      - name: Show toolchain
        run: rustc --version && cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Docs
        run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  # A short fuzz run on every change, sized to catch a regression that the
  # property tests miss without holding up a PR. The deep runs happen on the
  # schedule in fuzz.yml; this is a smoke test, and it is only meaningful
  # because the corpus is seeded first.
  fuzz-smoke:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rs
    steps:
      - uses: actions/checkout@v7

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Seed corpus
        run: |
          cargo run --example seed-corpus --features testing -- fuzz/corpus/decoders
          cargo run --example seed-corpus --features testing -- fuzz/corpus/control_frame

      - name: Fuzz decoders
        run: cargo +nightly fuzz run decoders -- -max_total_time=60

      - name: Fuzz control frame stream
        run: cargo +nightly fuzz run control_frame -- -max_total_time=60

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: rs/fuzz/artifacts/

  # Vendoring quinn is only worth anything if it stays unmodified and is
  # actually the copy that gets linked. Both claims decay silently, so both are
  # checked rather than trusted.
  vendor:
    name: Vendored quinn
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify
        run: ./vendor/verify-quinn.sh

  # The only runner with an iOS SDK on it, and the only place the SwiftUI layer
  # is executed rather than merely compiled. The `#if os(iOS)` branches in the
  # SDK are read nowhere else either.
  swift:
    name: Swift
    # macos-26 for the iOS 26 SDK; the macos-15 image tops out below the floor.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      # Asserts the requirement, not a version string. What the build actually
      # needs is an iOS 26 SDK -- the deployment floor is 26, and SwiftPM must
      # be new enough to parse `.v26` at all -- so that is what gets checked.
      # Naming an exact Xcode here instead would rot at the next image bump and
      # fail with "not found" rather than with the reason.
      #
      # This replaces an earlier pin to 16.4, whose rationale was that building
      # against the oldest supported SDK catches accidental use of newer APIs.
      # Raising the floor to 26 inverted that: the oldest supported SDK is now
      # the newest one, and the APIs in question are the point rather than an
      # accident.
      - name: Toolchain
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          sdk=$(xcodebuild -showsdks | sed -n 's/.*-sdk iphoneos\([0-9][0-9]*\).*/\1/p' | sort -n | tail -1)
          if [ -z "$sdk" ] || [ "$sdk" -lt 26 ]; then
            echo "::error::need an iOS 26 SDK, newest on this image is '${sdk:-none}' ($latest)"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          swift --version && xcodebuild -version

      # The package builds for macOS, so the shared logic -- rooms, layer
      # selection, the session machine -- is tested on the host rather than in a
      # simulator, which is faster and where all 103 tests live.
      - name: Build and test the package
        working-directory: sdk/ios
        run: |
          swift build
          swift test

      - name: Install xcodegen and xcbeautify
        run: brew install xcodegen xcbeautify

      # project.yml is the source and the pbxproj is generated, so this also
      # confirms the generator still agrees with the file.
      - name: Generate the sample project
        working-directory: samples/ios
        run: xcodegen generate

      # Booted explicitly rather than letting xcodebuild pick, so a runner image
      # that ships a different set of devices fails here with a clear message
      # instead of somewhere inside the test run.
      - name: Boot a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          # Runtime identifiers look like com.apple.CoreSimulator.SimRuntime.iOS-26-2.
          # An iOS 17 device would install fine and then fail to launch an app
          # built for 26, so the floor is enforced when picking, not after.
          runtimes = sorted(
              (rt for rt in devices if '.iOS-' in rt and int(rt.split('.iOS-')[1].split('-')[0]) >= 26),
              key=lambda rt: [int(p) for p in rt.split('.iOS-')[1].split('-')],
              reverse=True,
          )
          for rt in runtimes:
              for dev in devices[rt]:
                  if 'iPhone' in dev['name']:
                      print(dev['udid'])
                      sys.exit(0)
          sys.exit('no iOS 26+ iPhone simulator on this image')
          ")
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b

      # The only place the SwiftUI layer runs. No signing: a simulator needs
      # none, and the runner has no team.
      #
      # pipefail is load-bearing. Without it the pipeline reports xcbeautify's
      # exit code, xcodebuild's failure is discarded, and the job goes green on
      # a broken build -- which is worse than having no job at all.
      - name: Run the sample's UI tests
        working-directory: samples/ios
        shell: bash
        run: |
          set -o pipefail
          xcodebuild test \
            -project MoqomRoom.xcodeproj \
            -scheme MoqomRoomUITests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
        env:
          NSUnbufferedIO: YES

  # The plan is a document, so nothing about it fails to compile. Checking it
  # against the tree is what keeps it from quietly becoming fiction -- in both
  # directions, since an item stuck on "pending" after the work landed misleads
  # exactly as much as one marked done that was never built.
  plan:
    name: Plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - run: pip install pyyaml

      - name: Check the plan against the tree
        run: python3 tools/plan-check.py

  # Terraform is the one layer where a mistake is discovered by a failed apply
  # against a real project, which is the most expensive place to find one.
  # Formatting and schema validation are cheap and catch a useful fraction of it
  # -- not quota, org policy, or IAM propagation, which need a plan.
  terraform:
    name: Terraform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -recursive -check -diff

      # Every module standalone as well as the roots: a module only ever
      # reached through a root can carry a schema error that the root's own
      # variables happen to paper over.
      - name: Validate
        run: |
          set -euo pipefail
          for dir in bootstrap envs/* modules/*; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          # Re-enable once there is a go.sum; setup-go's cache requires one.
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./...
