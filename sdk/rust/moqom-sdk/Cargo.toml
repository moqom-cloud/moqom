[package]
name = "moqom-sdk"
version = "0.1.0"
description = "Server-side SDK for MOQOM: rooms, moderation, tokens, and room events."
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
prost.workspace = true
prost-types.workspace = true
thiserror.workspace = true
tonic = { workspace = true, features = ["channel", "codegen", "router", "server", "tls-ring", "tls-native-roots"] }
tonic-prost.workspace = true
tokio = { workspace = true, features = ["rt", "time", "macros"] }
bitflags = "2"
getrandom = "0.3"
tokio-stream = "0.1"
http = "1"

[build-dependencies]
# Only used when MOQOM_REGENERATE_PROTO is set. Generated code is checked in so
# that building this crate needs no protoc, which a published SDK cannot demand of
# the people who depend on it.
tonic-prost-build = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros", "time"] }
