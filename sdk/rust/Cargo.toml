[workspace]
resolver = "3"
members = ["moqom-sdk"]

# A workspace of its own, not a member of `rs/`.
#
# Two reasons, and the licence is the smaller one. `rs/` is where the relay lives,
# which is BUSL-1.1, and this is Apache-2.0 -- but crates carry their own licence
# fields, so that alone would not need a split. The reason that does is that `rs/`
# patches crates.io to a vendored quinn, and a patch applies to a whole workspace.
# A backend that takes a dependency on this SDK should not thereby take a
# dependency on our transport tree, so this workspace has no patch section and no
# QUIC in its graph at all.
[workspace.package]
edition = "2024"
rust-version = "1.97"
authors = ["MOQOM"]
license = "Apache-2.0"
repository = "https://github.com/moqom-cloud/moqom-rust"

[workspace.dependencies]
prost = "0.14"
prost-types = "0.14"
thiserror = "2"
tokio = { version = "1", default-features = false }
tonic = { version = "0.14", default-features = false }
tonic-prost = "0.14"

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
