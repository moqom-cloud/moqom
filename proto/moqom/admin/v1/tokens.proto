// Minting the tokens a client joins with.
//
// This is the call a backend makes most, and the one that decides who anybody
// is. A customer's server authenticates its user however it already does, then
// asks for a token naming that user, that device, that room, and exactly the
// rights they should have. MOQOM never sees the customer's password database
// and never needs to.
//
// The signing key never leaves the control plane. That is the difference from
// the SDK-side token builders this replaces, where the tenant's signing secret
// is shipped into every backend that mints and leaks with any one of them.

syntax = "proto3";

package moqom.admin.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "moqom/admin/v1/common.proto";

option go_package = "github.com/moqom-cloud/moqom-go/admin/adminpb;adminpb";

service Tokens {
  rpc MintClientToken(MintClientTokenRequest) returns (MintClientTokenResponse);

  // The public keys relays and clients verify tokens with.
  //
  // Served rather than configured so a key can be rotated without a deploy: a
  // new key is published here, tokens start being signed with it, and the old
  // one is withdrawn once every token it signed has expired.
  rpc ListVerificationKeys(ListVerificationKeysRequest) returns (ListVerificationKeysResponse);

  // Turn on, change or turn off Apple sign-in hosted by MOQOM for a tenant.
  //
  // For apps with no backend: the control plane's public listener checks App
  // Attest and Sign in with Apple and mints for the rooms named here, with the
  // publish rights named here and never moderation or ownership. It never
  // creates a room. An owner key only.
  rpc SetAppleSignIn(SetAppleSignInRequest) returns (AppleSignIn);
  rpc GetAppleSignIn(GetAppleSignInRequest) returns (AppleSignIn);
}

message MintClientTokenRequest {
  string tenant = 1;

  // The account this token speaks for. The customer's own identifier — MOQOM
  // has no opinion about its shape beyond it being a string.
  string username = 2;

  // The device's public key thumbprint, base64url of the SHA-256 JWK
  // thumbprint.
  //
  // The client generates the key in its secure element and never exports it, so
  // this is the only part of the device identity a backend ever handles. The
  // `device` field of every `Identity` for this session is derived from it, so
  // a device ban and this value are the same fact.
  string device_thumbprint = 3;

  // Which room. Empty mints a token good for the tenant's discovery surface but
  // no room, which is what a client needs before it has chosen one.
  string room = 4;

  // What they may do. Subject to the same superset rule as `SetGrants`: a
  // service account cannot mint a token more powerful than its own scope.
  Grants grants = 5;

  // Expand a preset into the moderation half of `grants`.
  CapabilityPreset preset = 6;

  // How long the token is good for.
  //
  // Short by default and short on purpose: a token is the one credential that
  // leaves the building, and until DPoP proof-of-possession lands (see
  // `TokenBinding`) a stolen one is replayable by whoever holds it. An hour is
  // the ceiling; the client refreshes rather than holding a long one.
  google.protobuf.Duration lifetime = 7;

  // Join backstage rather than the room proper. The token names the `bs`
  // namespace, and going live later is a namespace change rather than a new
  // token.
  bool backstage = 8;

  // Attest that this user's age has been verified, for rooms whose policy
  // demands it. The tenant performs the verification; this asserts it happened.
  bool age_verified = 9;

  // The username whose following brought this user to the room, when the tenant
  // knows. Empty when they found it themselves, which is the common case and a
  // number worth having rather than a gap to apologise for.
  //
  // Only the tenant can supply this. MOQOM sees a viewer arrive with a token; it
  // has no way to know they tapped a notification about a particular cohost, or
  // followed a link that cohost posted. So it is asserted at mint time, signed
  // into the token, and thereafter unforgeable by the client -- which matters,
  // because when two cohosts bring their own followings to one room these counts
  // are what a revenue split is argued over.
  //
  // Capture it from the start even if nothing reads it yet. Provenance is a fact
  // about the moment somebody arrived, and unlike almost everything else here it
  // cannot be recomputed later from what was stored: a viewer who joined through
  // a cohost's link is indistinguishable, an hour afterwards, from one who did
  // not.
  //
  // Rejected if it names the user themselves, or if no `room` is given, since
  // neither can mean anything.
  string arrived_via = 10;
}

message MintClientTokenResponse {
  // The token, in the compact form the client passes in MOQT Setup Options.
  string token = 1;

  google.protobuf.Timestamp expires_at = 2;

  // The identity this token will present as, with the device already derived
  // from the thumbprint. Returned so a backend can record what it handed out
  // without reimplementing the derivation.
  Identity identity = 3;

  // Which key signed it, matching a `VerificationKey.key_id`.
  string key_id = 4;

  // What the token's room allows of direct paths, for the backend to hand to
  // the client with the token. Unset for a token that names no room.
  DirectGrant direct = 5;

  // The relays a token for a private tenant must dial, as `host:port`: its
  // relay pool's. Empty for the shared fleet, which is reached by its usual
  // name. Every other relay refuses the token with `wrong_pool`, so a client
  // given these dials one of them and nothing else.
  repeated string relays = 6;
}

// How a token is tied to the holder.
enum TokenBinding {
  TOKEN_BINDING_UNSPECIFIED = 0;

  // Bearer. Whoever holds the token is the user, so a leaked token is a leaked
  // account until it expires. This is what is implemented today, and the reason
  // lifetimes are short.
  TOKEN_BINDING_BEARER = 1;

  // Proof of possession: the client signs a challenge with the device key on
  // every session, so the token is useless without the secure element that
  // holds the private half. This is the target, and what `device_thumbprint`
  // and the `cnf/jkt` claim already exist to support.
  TOKEN_BINDING_DPOP = 2;
}

message ListVerificationKeysRequest {
  string tenant = 1;
}

message VerificationKey {
  string key_id = 1;

  // The algorithm, as a JOSE identifier: `ML-DSA-87`, the only one tokens
  // are signed or verified with.
  string algorithm = 2;

  // The public key as a JWK.
  string jwk = 3;

  google.protobuf.Timestamp not_before = 4;

  // When this key stops signing. It must remain published until every token it
  // signed has expired, or rotation becomes an outage.
  google.protobuf.Timestamp retires_at = 5;
}

message ListVerificationKeysResponse {
  repeated VerificationKey keys = 1;

  // What binding this deployment issues. A client that wants to refuse bearer
  // tokens can find out here rather than by inspecting one.
  TokenBinding binding = 2;
}

message SetAppleSignInRequest {
  string tenant = 1;

  // The Apple team the apps are signed by. App Attest keys attested for any
  // other team are refused.
  string team_id = 2;

  // The apps. Apple's identity token must name one as its audience. Empty
  // turns Apple sign-in off for the tenant.
  repeated string bundle_ids = 3;

  // The existing rooms a signed-in person may be minted for.
  repeated string rooms = 4;

  // What they may publish there.
  repeated PublishScope publish = 5;

  // Accept App Attest keys from Apple's development environment, for builds
  // run from Xcode. Leave off in production.
  bool allow_development = 6;
}

message GetAppleSignInRequest {
  string tenant = 1;
}

message AppleSignIn {
  string tenant = 1;
  string team_id = 2;
  repeated string bundle_ids = 3;
  repeated string rooms = 4;
  repeated PublishScope publish = 5;
  bool allow_development = 6;
  google.protobuf.Timestamp updated_at = 7;

  // Where devices sign in: the control plane's public listener.
  string sign_in_path = 8;
  string token_path = 9;
}
